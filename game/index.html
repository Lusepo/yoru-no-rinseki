<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>夜の隣席</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" class="instant" aria-live="polite">
  <div id="bg" class="layer fade-layer"><img alt="" draggable="false"><img alt="" draggable="false"></div>
  <div id="chars" class="layer"></div>
  <div id="cg" class="layer fade-layer"><img alt="" draggable="false"><img alt="" draggable="false"></div>
  <div id="loc" class="loc" hidden><span class="loc-place"></span><span class="loc-time"></span></div>
  <div id="modes" class="modes"><span id="mode-auto" hidden>AUTO</span><span id="mode-skip" hidden>SKIP</span></div>

  <div id="choices" class="choices" hidden></div>

  <div id="box" class="box" hidden>
    <div id="nameplate" class="nameplate" hidden></div>
    <div id="text" class="text"><span id="tv"></span><span id="th" class="th"></span><span id="cursor" class="cursor" hidden></span></div>
    <div id="measure" class="text measure" aria-hidden="true"></div>
    <div class="toolbar" id="toolbar">
      <button type="button" data-act="auto">オート</button>
      <button type="button" data-act="skip">スキップ</button>
      <button type="button" data-act="log">ログ</button>
      <button type="button" data-act="save">セーブ</button>
      <button type="button" data-act="load">ロード</button>
      <button type="button" data-act="hide">隠す</button>
      <button type="button" data-act="menu">メニュー</button>
    </div>
  </div>

  <!-- title -->
  <section id="title" class="screen">
    <img class="title-bg" src="../art/bg/bg_rooftop_bar_calm.jpg" alt="" draggable="false">
    <div class="title-veil"></div>
    <div class="title-head">
      <h1 class="title-logo">夜の隣席</h1>
      <p class="title-sub">yoru no rinseki</p>
    </div>
    <nav class="title-menu">
      <button type="button" data-act="new">はじめから</button>
      <button type="button" data-act="continue" id="btn-continue">つづきから</button>
      <button type="button" data-act="load">ロード</button>
      <button type="button" data-act="gallery">ギャラリー</button>
      <button type="button" data-act="endings">エンディング</button>
      <button type="button" data-act="settings">設定</button>
    </nav>
  </section>

  <!-- panels -->
  <section id="p-name" class="panel modal-panel" hidden>
    <div class="card">
      <h2>名前を入力してください</h2>
      <p class="hint">1〜8文字。そのまま決定すると「<span id="name-default"></span>」になります。</p>
      <input id="name-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <p id="name-err" class="err" role="alert"></p>
      <button type="button" id="name-ok" class="primary">決定</button>
    </div>
  </section>

  <section id="p-saveload" class="panel" hidden>
    <header><h2 id="sl-title">セーブ</h2><button type="button" class="close" data-close>閉じる</button></header>
    <div class="scroll"><ul id="slots" class="slots"></ul></div>
  </section>

  <section id="p-log" class="panel" hidden>
    <header><h2>ログ</h2><button type="button" class="close" data-close>閉じる</button></header>
    <div class="scroll" id="log-scroll"><ol id="log-list" class="log"></ol></div>
  </section>

  <section id="p-gallery" class="panel" hidden>
    <header><h2>ギャラリー <span id="gal-count" class="count"></span></h2><button type="button" class="close" data-close>閉じる</button></header>
    <div class="scroll"><ul id="gal-grid" class="gal"></ul></div>
  </section>

  <section id="p-viewer" class="panel viewer" hidden><img id="viewer-img" alt="" draggable="false"></section>

  <section id="p-endings" class="panel" hidden>
    <header><h2>エンディング <span id="end-count" class="count"></span></h2><button type="button" class="close" data-close>閉じる</button></header>
    <div class="scroll"><ol id="end-list" class="endlist"></ol></div>
  </section>

  <section id="p-settings" class="panel" hidden>
    <header><h2>設定</h2><button type="button" class="close" data-close>閉じる</button></header>
    <div class="scroll settings">
      <label>文字の表示速度 <output id="speed-out"></output>
        <input id="speed" type="range" min="1" max="10" step="1"></label>
      <label>オートの待ち時間 <output id="auto-out"></output>
        <input id="autowait" type="range" min="1" max="10" step="1"></label>
      <p class="note">スキップは既読の文章だけを送ります。未読の文章、選択肢、名前入力で止まります。</p>
      <div class="preview text" id="speed-preview"></div>
    </div>
  </section>

  <section id="p-menu" class="panel modal-panel" hidden>
    <div class="card menu-card">
      <button type="button" data-act="settings">設定</button>
      <button type="button" data-act="gallery">ギャラリー</button>
      <button type="button" data-act="endings">エンディング</button>
      <button type="button" data-act="totitle">タイトルへ戻る</button>
      <button type="button" data-close class="ghost">閉じる</button>
    </div>
  </section>

  <section id="p-ending" class="panel ending" hidden>
    <div class="end-inner">
      <p class="end-mark">— END —</p>
      <h2 id="end-title"></h2>
      <p id="end-progress" class="end-progress"></p>
      <p class="end-tap">タップでタイトルへ</p>
    </div>
  </section>

  <section id="p-confirm" class="panel modal-panel confirm" hidden>
    <div class="card">
      <p id="confirm-msg"></p>
      <div class="row"><button type="button" id="confirm-no" class="ghost">いいえ</button><button type="button" id="confirm-yes" class="primary">はい</button></div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <div id="boot" class="boot">読み込み中…</div>
</div>
<script src="engine.js"></script>
</body>
</html>
